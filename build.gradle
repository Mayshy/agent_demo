plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.0'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'askred'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-elasticsearch'

    // LangChain4j — LLM integration (OpenAI-compatible → DeepSeek)
    implementation 'dev.langchain4j:langchain4j:1.13.0'
    implementation 'dev.langchain4j:langchain4j-open-ai:1.13.0'
    implementation 'org.bsc.langgraph4j:langgraph4j-core:1.5.0'

    // JSON processing
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    // Lombok (optional, for cleaner code)
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}
